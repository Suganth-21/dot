name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dot
          POSTGRES_PASSWORD: dot
          POSTGRES_DB: dot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dot -d dot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://dot:dot@localhost:5432/dot_test
      DATABASE_URL: postgresql+asyncpg://dot:dot@localhost:5432/dot_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check app tests

      - name: Alembic upgrade head
        run: python -m alembic upgrade head

      - name: pytest
        run: python -m pytest -q
