version: "3.9"

# Phase 9 — BUILDPHASES.md: "containerised later." Not required for the
# demo (run locally is the documented fallback); provided so `docker
# compose up` is a real, working path for whoever deploys this beyond a
# laptop. Copy backend/.env.example to backend/.env and fill in real
# secrets before using this — no defaults here are safe for anything but
# a throwaway local run.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dot
      POSTGRES_PASSWORD: dot
      POSTGRES_DB: dot
    ports:
      - "5432:5432"
    volumes:
      - dot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dot -d dot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dot:dot@postgres:5432/dot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  dot_pgdata:
